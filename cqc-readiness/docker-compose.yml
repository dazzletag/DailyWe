version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cqc_readiness
      POSTGRES_USER: cqc
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cqc -d cqc_readiness"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://cqc:devpassword@db:5432/cqc_readiness
      GRAPH_TENANT_ID: placeholder
      GRAPH_CLIENT_ID: placeholder
      GRAPH_CLIENT_SECRET: placeholder
      GRAPH_SENDER_EMAIL: noreply@example.com
      CQM_ALERT_EMAIL: cqm@example.com
      APP_BASE_URL: http://localhost:8000
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: "$2b$12$placeholder"
      SCHEDULER_SEND_HOUR: "7"
      SCHEDULER_TIMEZONE: Europe/London
      TOKEN_EXPIRY_HOURS: "16"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  pgdata:
